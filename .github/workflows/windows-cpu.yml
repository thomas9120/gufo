name: Windows CPU

on:
  push:
    branches: [main, windows-main, feat/windows-cpu-compat]
  pull_request:
    branches: [main, windows-main, feat/windows-cpu-compat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-launcher:
    name: Browser launcher checks
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GUI_TEST_PYTHON: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install launcher fixture dependencies
        run: python -m pip install -r tools/gui/requirements.txt

      - name: Run launcher unit tests
        run: python -m unittest discover -s tests/tools -p "gui_*_test.py"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install DOM test dependency
        run: npm install --prefix build/gui-test-js --no-save --package-lock=false --ignore-scripts jsdom@26.1.0

      - name: Check launcher browser behavior
        run: node --experimental-vm-modules --test tests/tools/gui_dom_test.mjs tests/tools/gui_runtime_dom_test.mjs

  sync-guards:
    name: Upstream difference guard
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch official Gufo
        run: git fetch --no-tags https://github.com/gufo-org/gufo.git +main:refs/remotes/official/main

      - name: Check the maintained difference
        shell: pwsh
        run: ./tools/windows/diff-guard.ps1

      - name: Run sync tool tests
        run: python -m unittest tests/tools/sync_tools_test.py tests/tools/first_prompt_control_test.py tests/tools/win32_functional_budget_test.py tests/tools/windows_build_test.py -v

  installer:
    name: Installer checks
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render installer screens and check layout
        run: python -m unittest discover -s tests/tools -p "installer_*_test.py" -v

      - name: Render every screen at the minimum size
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          ./tools/installer/preview.ps1 -Screen all -Width 72 -Height 20 -Mode None -OutFile build/installer-min.txt
          Get-Content build/installer-min.txt -TotalCount 8

      - name: Parse installer scripts with Windows PowerShell
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in @('tools/installer/Gufo-Setup.ps1', 'tools/installer/preview.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$null, [ref]$errors)
            foreach ($error in @($errors)) {
              Write-Host "$file`: $($error.Message)"
              $failed = $true
            }
          }
          if ($failed) { throw 'Installer scripts have parse errors' }

  windows-cpu:
    name: Native CPU contracts
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/build/vcpkg-archives,readwrite
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore pinned compiler
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/windows-ci/clang+llvm-*-x86_64-pc-windows-msvc
          key: windows-cpu-llvm-${{ runner.arch }}-${{ hashFiles('tools/windows/setup-ci.ps1') }}

      - name: Restore dependency archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/vcpkg-archives
          key: windows-cpu-vcpkg-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'tools/windows/setup-ci.ps1') }}-${{ github.sha }}
          restore-keys: |
            windows-cpu-vcpkg-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'tools/windows/setup-ci.ps1') }}-

      - name: Configure and build bounded CPU targets
        run: |
          New-Item -ItemType Directory -Force build/windows-ci/logs, build/vcpkg-archives | Out-Null
          Start-Transcript -Path build/windows-ci/logs/build.txt
          try {
            $tools = & ./tools/windows/setup-ci.ps1
            Write-Host "Runner image: $env:ImageOS $env:ImageVersion"
            & "$($tools.CompilerBin)/clang.exe" --version
            cmake --version
            ninja --version
            python --version
            & "$($tools.Vcpkg)/vcpkg.exe" version
            & ./tools/windows/build.ps1 -CompilerBin $tools.CompilerBin -Vcpkg $tools.Vcpkg -Jobs 4
          } finally { Stop-Transcript }

      - name: Run bounded native checks
        run: |
          ctest --preset windows-cpu --no-tests=error --output-junit "$PWD/build/windows-ci/logs/tests.xml" 2>&1 |
            Tee-Object -FilePath build/windows-ci/logs/tests.txt
          if ($LASTEXITCODE -ne 0) { throw "Windows CPU checks failed" }

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-cpu-logs
          path: |
            build/windows-ci/logs/
            build/windows-cpu/CMakeCache.txt
            build/windows-cpu/CMakeFiles/CMakeConfigureLog.yaml
            build/windows-cpu/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14
